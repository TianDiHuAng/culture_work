<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="680" height="400" fill="#fdf9f1" rx="10"/>
<rect x="14" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="40" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">窗</text>
<text x="114.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">第一天</text>
<text x="24" y="104.0" font-size="12" fill="#555">'明天去灯塔'的许诺</text>
<rect x="228" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="40" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="328.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">时光流逝</text>
<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">空屋十年</text>
<text x="238" y="104.0" font-size="12" fill="#555">战争·死亡·荒芜</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">灯塔</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">十年后</text>
<text x="452" y="104.0" font-size="12" fill="#555">莉丽完成'vision'</text>
<text x="340.0" y="390" font-size="12" fill="#8a8378" text-anchor="middle">《到灯塔去》三部结构图</text>
