<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="680" height="420" fill="#fdf9f1" rx="10"/>
<rect x="14" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="40" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">秋夜·枣树</text>
<text x="114.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">开篇的怪异重复</text>
<text x="24" y="104.0" font-size="12" fill="#555">直刺奇怪而高的天空</text>
<rect x="228" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="40" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="328.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">影的告别</text>
<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">中间物</text>
<text x="238" y="104.0" font-size="12" fill="#555">不愿天堂不愿地狱</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">死火</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">冰谷中的火</text>
<text x="452" y="104.0" font-size="12" fill="#555">'那我就不如烧完'</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">这样的战士</text>
<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">无物之阵</text>
<text x="24" y="238.0" font-size="12" fill="#555">举起投枪</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="328.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">墓碣文</text>
<text x="328.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">抉心自食</text>
<text x="238" y="238.0" font-size="12" fill="#555">自我解剖的极限</text>
<rect x="442" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="174" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="542.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">过客</text>
<text x="542.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">明知是坟</text>
<text x="452" y="238.0" font-size="12" fill="#555">'我只得走'</text>
<text x="340.0" y="410" font-size="12" fill="#8a8378" text-anchor="middle">《野草》核心意象结构图（23篇）</text>
</svg>
