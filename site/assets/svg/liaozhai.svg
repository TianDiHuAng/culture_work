<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="680" height="420" fill="#fdf9f1" rx="10"/>
<rect x="14" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="40" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">人鬼狐妖之恋</text>
<text x="114.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">婴宁·聂小倩·莲香</text>
<text x="24" y="104.0" font-size="12" fill="#555">花妖狐魅，多具人情</text>
<rect x="228" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="40" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="328.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">科举批判</text>
<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">叶生·司文郎</text>
<text x="238" y="104.0" font-size="12" fill="#555">黜佳士而进凡庸</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">官府黑暗</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">促织·席方平</text>
<text x="452" y="104.0" font-size="12" fill="#555">冥府即衙门</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="114.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">寓言警世</text>
<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">画皮·崂山道士</text>
<text x="24" y="238.0" font-size="12" fill="#555">明明妖也以为美</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="328.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">异史氏曰</text>
<text x="328.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">篇末论赞</text>
<text x="238" y="238.0" font-size="12" fill="#555">仿《史记》而鸣不平</text>
<rect x="442" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="174" width="200" height="6" rx="3" fill="#55606b"/>
<text x="542.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">431篇·文言</text>
<text x="542.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">1679年大体完成</text>
<text x="452" y="238.0" font-size="12" fill="#555">死后约50年刊行</text>
<text x="340.0" y="410" font-size="12" fill="#8a8378" text-anchor="middle">《聊斋志异》题材与叙事层次结构图</text>
</svg>
