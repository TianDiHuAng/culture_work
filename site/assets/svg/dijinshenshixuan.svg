<text x="238" y="104.0" font-size="12" fill="#555">'有羽毛的东西'</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#55606b"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">信仰与怀疑</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">Faith/Doubt</text>
<text x="452" y="104.0" font-size="12" fill="#555">'我从未在教堂找到家'</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="114.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">自然</text>
<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">Nature</text>
<text x="24" y="238.0" font-size="12" fill="#555">蛇、蜂、日落</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="328.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">孤立</text>
