<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" font-family=""Segoe UI","Microsoft YaHei","PingFang SC",sans-serif">
<rect x="0" y="0" width="680" height="420" fill="#fdf9f1" rx="10"/>
<rect x="14" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="40" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="114.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">第一幕 1898</text>
<text x="114.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">戊戌变法失败</text>
<text x="24" y="104.0" font-size="12" fill="#555">卖女·太监娶妻·实业救国</text>
<rect x="228" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="40" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="328.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">第二幕 民国初</text>
<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">军阀混战</text>
<text x="238" y="104.0" font-size="12" fill="#555">巡警敲诈·误杀刘麻子</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">第三幕 1945—48</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">国民党统治</text>
<text x="452" y="104.0" font-size="12" fill="#555">工厂没收·茶馆上吊</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">王利发</text>
<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">掌柜</text>
<text x="24" y="238.0" font-size="12" fill="#555">'改良'了一辈子</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="328.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">常四爷</text>
<text x="328.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">旗人</text>
<text x="238" y="238.0" font-size="12" fill="#555">'谁爱我呢'</text>
<rect x="442" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="174" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="542.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">撒纸钱</text>
<text x="542.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">祭奠自己</text>
<text x="452" y="238.0" font-size="12" fill="#555">三个老人的谢幕</text>
<text x="340.0" y="410" font-size="12" fill="#8a8378" text-anchor="middle">《茶馆》三幕时代结构图</text>
</svg>
