<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="680" height="400" fill="#fdf9f1" rx="10"/>
<rect x="14" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="40" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">里厄医生</text>
<text x="114.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">'治病'</text>
<text x="24" y="104.0" font-size="12" fill="#555">正直的本分主义者</text>
<rect x="228" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="40" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="328.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">塔鲁</text>
<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">'不在鼠疫一边'</text>
<text x="238" y="104.0" font-size="12" fill="#555">志愿者·殉道者</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">朗贝尔</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">从逃城到留下</text>
<text x="452" y="104.0" font-size="12" fill="#555">'独自幸福是可耻的'</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#55606b"/>
<text x="114.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">帕纳卢</text>
<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">从天罚到祈祷</text>
<text x="24" y="238.0" font-size="12" fill="#555">信仰的演化</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="328.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">科塔尔</text>
<text x="328.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">'鼠疫中的快乐人'</text>
<text x="238" y="238.0" font-size="12" fill="#555">恶的适应者</text>
<rect x="442" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="174" width="200" height="6" rx="3" fill="#a8642a"/>
<text x="542.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">杆菌</text>
<text x="542.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">'永远不死'</text>
<text x="452" y="238.0" font-size="12" fill="#555">结尾的清醒</text>
<text x="340.0" y="390" font-size="12" fill="#8a8378" text-anchor="middle">《鼠疫》人物立场结构图</text>
</svg>
