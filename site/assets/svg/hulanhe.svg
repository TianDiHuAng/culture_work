<text x="238" y="238.0" font-size="12" fill="#555">可怜又可笑的长工</text>
<rect x="442" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="174" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="542.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">冯歪嘴子</text>
