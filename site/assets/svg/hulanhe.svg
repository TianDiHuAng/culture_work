<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">第五章</text>
<text x="24" y="238.0" font-size="12" fill="#555">被'治病'折腾而死</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#3b6b8c"/>
