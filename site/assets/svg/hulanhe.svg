<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
<rect x="0" y="0" width="680" height="420" fill="#fdf9f1" rx="10"/>
