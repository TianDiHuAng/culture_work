<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">第三章</text>
<text x="238" y="104.0" font-size="12" fill="#555">'花开了，就像睡醒了似的'</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#55606b"/>
