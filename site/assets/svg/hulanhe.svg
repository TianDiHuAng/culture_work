<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">第四章</text>
<text x="452" y="104.0" font-size="12" fill="#555">反复咏叹的'荒凉'</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#a8642a"/>
