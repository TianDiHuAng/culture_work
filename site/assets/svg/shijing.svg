<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" font-family=""Segoe UI","Microsoft YaHei","PingFang SC",sans-serif">
<rect x="0" y="0" width="680" height="420" fill="#fdf9f1" rx="10"/>
<rect x="14" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="40" width="200" height="6" rx="3" fill="#8c3b3b"/>
<text x="114.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">风（国风）</text>
<text x="114.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">十五国民歌</text>
<text x="24" y="104.0" font-size="12" fill="#555">婚恋、农事、征役；文学价值最高</text>
<rect x="228" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="40" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="328.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">小雅</text>
<text x="328.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">宫廷宴饮乐歌</text>
<text x="238" y="104.0" font-size="12" fill="#555">宴饮之外多刺时政之作</text>
<rect x="442" y="40" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="40" width="200" height="6" rx="3" fill="#3b6b8c"/>
<text x="542.0" y="66.0" font-size="15" fill="#3a3a3a" text-anchor="middle">大雅</text>
<text x="542.0" y="84.0" font-size="11" fill="#8a8378" text-anchor="middle">王室正声</text>
<text x="452" y="104.0" font-size="12" fill="#555">周民族史诗与政治颂赞</text>
<rect x="14" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="14" y="174" width="200" height="6" rx="3" fill="#9a7b2f"/>
<text x="114.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">颂</text>
<text x="114.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">宗庙祭祀乐歌</text>
<text x="24" y="238.0" font-size="12" fill="#555">周颂·鲁颂·商颂，庄重典雅</text>
<rect x="228" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="228" y="174" width="200" height="6" rx="3" fill="#55606b"/>
<text x="328.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">总数 305 篇</text>
<text x="328.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">另有六篇笙诗存目</text>
<text x="238" y="238.0" font-size="12" fill="#555">汉初四家传诗，唯毛诗独存</text>
<rect x="442" y="174" width="200" height="120" rx="8" fill="#fff" stroke="#d8cdbb"/>
<rect x="442" y="174" width="200" height="6" rx="3" fill="#5e7d5a"/>
<text x="542.0" y="200.0" font-size="15" fill="#3a3a3a" text-anchor="middle">赋 · 比 · 兴</text>
<text x="542.0" y="218.0" font-size="11" fill="#8a8378" text-anchor="middle">三大手法</text>
<text x="452" y="238.0" font-size="12" fill="#555">与风雅颂并称'六义'</text>
<text x="340.0" y="410" font-size="12" fill="#8a8378" text-anchor="middle">《诗经》'风·雅·颂'结构图（305篇，据 Britannica/教育百科；各部分细数见待核实）</text>
</svg>
